        async function saveAllProfits() {
            if(state.financeConfig.financialEra) { alert('Use Receita Simulada no perfil de cada empresa. Lucros avulsos foram desativados para preservar a contabilidade.'); return; }
            const inputs = document.querySelectorAll('.profit-input');
            const batch = writeBatch(db);
            let updateCount = 0;

            inputs.forEach(input => {
                const val = parseFloat(input.value || 0);
                if (val !== 0) {
                    const bizId = input.dataset.bizId;
                    const biz = state.businesses.find(b => b.id === bizId);
                    if (biz) {
                        const newBalance = (biz.balance || 0) + val;
                        batch.update(doc(db, "businesses", bizId), { balance: newBalance });
                        updateCount++;
                    }
                }
            });

            if (updateCount === 0) {
                alert("Nenhum lucro preenchido.");
                return;
            }

            try {
                await batch.commit();
                alert(`Sucesso! Lucros de ${updateCount} empresas foram registrados.`);
                state.currentPage = 'businesses';
                render();
            } catch (err) {
                console.error("Erro ao salvar lucros em massa:", err);
                alert("Erro ao salvar lucros. Tente novamente.");
            }
        }


        // SIM.23.09#2.3 PURE HELPERS START
        function assetAccountKey(ownerType, ownerId) {
            if (ownerType === 'resident') return `residents:${ownerId}`;
            if (ownerType === 'business') return `businesses:${ownerId}`;
            if (ownerType === 'city') return 'treasury';
            return null;
        }
        function calculateNetWorth(balance, assets, loans) {
            const assetValue = (assets || []).reduce((sum, a) => sum + Number(a.value || 0), 0);
            const debt = (loans || []).filter(l => !['anistiado','quitado'].includes(l.status) && Number(l.remainingAmount || 0) > 0)
                .reduce((sum, l) => sum + Number(l.remainingAmount || 0), 0);
            return Math.round((Number(balance || 0) + assetValue - debt + Number.EPSILON) * 100) / 100;
        }
        function shouldSkipGenericRentExpense(residentId, expense, genericRentExpenseName, rentals) {
            if (!genericRentExpenseName || !expense || expense.name !== genericRentExpenseName) return false;
            return (rentals || []).some(r => r.active !== false && r.tenantType === 'resident' && r.tenantId === residentId);
        }
        function assetStatusLabel(asset, loans) {
            if (!asset?.financingLoanId) return 'Quitado';
            const loan = (loans || []).find(l => l.id === asset.financingLoanId);
            if (!loan || loan.status === 'quitado' || Number(loan.remainingAmount || 0) <= 0) return 'Quitado';
            return 'Financiado';
        }
        // SIM.23.09#2.3 PURE HELPERS END

        // SIM.23.09#2.2 PURE HELPERS START
        function getResidentCycleIncome(resident, appState) {
            const privateIncome = (resident?.employment || []).reduce((sum, job) => sum + Number(job.salary || 0), 0);
            const roleId = Object.keys(appState?.government?.roles || {}).find(key => appState.government.roles[key] === resident?.id);
            const publicIncome = roleId ? Number(appState?.government?.salaries?.[roleId] || 0) : 0;
            return Math.round((privateIncome + publicIncome + Number.EPSILON) * 100) / 100;
        }
        function getIncomeBand(income) {
            const n = Number(income || 0);
            if (n <= 2000) return 'low';
            if (n <= 4000) return 'middle';
            return 'high';
        }
        function isPackageEligibleForResident(pkg, resident, cycleNumber, appState) {
            if (!pkg || !resident || resident.isDeceased || pkg.active === false) return false;
            if ((pkg.forcedExcludeIds || []).includes(resident.id)) return false;
            if ((pkg.forcedIncludeIds || []).includes(resident.id)) return true;
            if (Number(pkg.effectiveFromCycle || 1) > Number(cycleNumber || 0)) return false;
            if (pkg.mode === 'manual') return (pkg.manualResidentIds || []).includes(resident.id);
            if (pkg.mode === 'automatic') return (pkg.incomeBands || []).includes(getIncomeBand(getResidentCycleIncome(resident, appState)));
            return false;
        }
        function canDebitWithGlobalLimit(balance, amount, negativeLimit) {
            return Math.round((Number(balance || 0) - Number(amount || 0)) * 100) / 100 >= -Math.abs(Number(negativeLimit || 0));
        }
        function validateProductSale(product, quantity) {
            const qty = Number(quantity);
            if (!Number.isInteger(qty) || qty <= 0) return { ok:false, reason:'Quantidade inválida' };
            if (!product || product.active === false) return { ok:false, reason:'Produto indisponível' };
            if (product.stockEnabled && Number(product.stockQty || 0) < qty) return { ok:false, reason:'Estoque insuficiente' };
            return { ok:true };
        }
        function resolveRecurringPrice(link, offer, cycleNumber) {
            if (link && link.pendingPrice !== undefined && Number(link.priceEffectiveFromCycle || Infinity) <= Number(cycleNumber || 0)) return Number(link.pendingPrice || 0);
            if (link && link.price !== undefined) return Number(link.price || 0);
            return Number(offer?.value ?? offer?.price ?? 0);
        }
        function calculateSaleTotals(product, quantity) {
            const q = Number(quantity || 0), price = Number(product?.salePrice || 0), cost = Number(product?.unitCost || 0);
            const round = v => Math.round((v + Number.EPSILON) * 100) / 100;
            const grossRevenue = round(q * price), costOfGoods = round(q * cost);
            return { quantity:q, grossRevenue, costOfGoods, grossProfit:round(grossRevenue-costOfGoods) };
        }
        // SIM.23.09#2.2 PURE HELPERS END

        // SIM.23.09#2.1: motor financeiro determinístico. Todos os valores monetários são arredondados a centavos.
        const simMoney = value => Math.round((Number(value) + Number.EPSILON) * 100) / 100;
        const simValidMoney = value => Number.isFinite(Number(value)) && Number(value) >= 0;
        const simEsc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const simFinAccount = (type, id) => `${type}:${id}`;
        let simCyclePreview = null;
        let simCycleBusy = false;

        function simPlanCycle(snapshot = state) {
            const cfg = snapshot.financeConfig;
            if (!cfg.financialEra) throw new Error('Inaugure a Nova Era Econômica antes de processar ciclos.');
            const cycle = (Number(cfg.cycleNumber) || 0) + 1;
            const limitValue = simMoney(cfg.negativeLimit ?? 15000);
            if (!simValidMoney(limitValue)) throw new Error('Limite negativo inválido.');
            const balances = new Map();
            const starting = new Map();
            const entries = [], pending = [], loanChanges = new Map();
            const put = (key, amount) => { balances.set(key, simMoney(amount)); starting.set(key, simMoney(amount)); };
            snapshot.residents.forEach(r => put(simFinAccount('residents', r.id), r.balance || 0));
            snapshot.businesses.forEach(b => put(simFinAccount('businesses', b.id), b.balance || 0));
            put('treasury', cfg.treasuryBalance || 0);
            const validAccount = key => key === 'treasury' || key === 'external' || balances.has(key);
            const check = (amount, label) => {
                if (!simValidMoney(amount)) throw new Error(`Valor inválido em ${label}.`);
                return simMoney(amount);
            };
            const transfer = (from, to, rawAmount, kind, label, obligationId) => {
                const amount = check(rawAmount, label);
                if (!amount) return true;
                if (!validAccount(from) || !validAccount(to)) {
                    pending.push({ from, to, kind, label, amount, obligationId, reason: 'Conta de origem ou destino ausente' });
                    return false;
                }
                if (from === to) return true;
                if (from !== 'external' && from !== 'treasury' && simMoney(balances.get(from) - amount) < -limitValue) {
                    pending.push({ kind, label, amount, obligationId, from, to, reason: 'Limite negativo atingido' });
                    return false;
                }
                if (from !== 'external') balances.set(from, simMoney(balances.get(from) - amount));
                if (to !== 'external') balances.set(to, simMoney(balances.get(to) + amount));
                entries.push({ from, to, amount, kind, label, obligationId: obligationId || null });
                return true;
            };
            const active = snapshot.residents.filter(r => !r.isDeceased);
            const externalRevenue = check(cfg.externalRevenueValue || 0, 'emissão externa do Tesouro');
            transfer('external', 'treasury', externalRevenue, 'emission', cfg.externalRevenueName || 'Emissão monetária programada', `external:${cycle}`);
            // Receita das empresas: configuração explícita de cada empresa, não lucro inventado pela aplicação.
            snapshot.businesses.forEach(b => {
                const base = check(b.simulatedRevenue || 0, `receita ${b.name}`);
                if (base && !(b.isPublicBody || b.sector === 'Governamental'))
                    transfer('external', simFinAccount('businesses', b.id), base, 'revenue', `Receita externa simulada: ${b.name}`, `revenue:${b.id}:${cycle}`);
            });
            const grossIncome = new Map(active.map(r => [r.id, 0]));
            const bizRevenue = new Map(snapshot.businesses.map(b => [b.id, check(b.simulatedRevenue || 0, `receita ${b.name}`)]));
            // Ordem estável de funcionários: identificador de residente, depois posição no cadastro.
            [...active].sort((a,b) => a.id.localeCompare(b.id)).forEach(r => {
                (r.employment || []).forEach((job, i) => {
                    const employer = snapshot.businesses.find(b => b.id === job.businessId);
                    const from = employer && (employer.isPublicBody || employer.sector === 'Governamental') ? 'treasury' : simFinAccount('businesses', job.businessId);
                    const amount = check(job.salary || 0, 'salário');
                    if (transfer(from, simFinAccount('residents', r.id), amount, 'salary', `Salário: ${job.position || 'Emprego'}`, `salary:${r.id}:${i}:${cycle}`)) grossIncome.set(r.id, simMoney(grossIncome.get(r.id) + amount));
                });
            });
            Object.keys(snapshot.government.roles || {}).sort().forEach(role => {
                const residentId = snapshot.government.roles[role];
                if (!residentId || !grossIncome.has(residentId)) return;
                const amount = check(snapshot.government.salaries?.[role] || 0, 'salário público');
                if (transfer('treasury', simFinAccount('residents', residentId), amount, 'salary', `Cargo público: ${role}`, `govsalary:${role}:${cycle}`)) grossIncome.set(residentId, simMoney(grossIncome.get(residentId) + amount));
            });
            // Base de imposto declarada: renda efetivamente recebida ou receita externa da empresa.
            active.forEach(r => {
                const base = grossIncome.get(r.id);
                snapshot.taxes.filter(t => t.category === 'resident').forEach(t => transfer(simFinAccount('residents', r.id), 'treasury', simMoney(base * check(t.rate, 'taxa') / 100), 'tax', t.name, `tax:${t.id}:${r.id}:${cycle}`));
                snapshot.specialTaxes.filter(t => t.targetIds?.includes(r.id)).forEach(t => transfer(simFinAccount('residents', r.id), 'treasury', simMoney(base * check(t.rate, 'taxa especial') / 100), 'tax', t.name, `special:${t.id}:${r.id}:${cycle}`));
            });
            snapshot.businesses.filter(b => !b.isPublicBody && b.sector !== 'Governamental').forEach(b => {
                const base = bizRevenue.get(b.id);
                snapshot.taxes.filter(t => t.category === 'business').forEach(t => transfer(simFinAccount('businesses', b.id), 'treasury', simMoney(base * check(t.rate, 'taxa') / 100), 'tax', t.name, `tax:${t.id}:${b.id}:${cycle}`));
                snapshot.specialTaxes.filter(t => t.targetIds?.includes(b.id)).forEach(t => transfer(simFinAccount('businesses', b.id), 'treasury', simMoney(base * check(t.rate, 'taxa especial') / 100), 'tax', t.name, `special:${t.id}:${b.id}:${cycle}`));
            });
            // Tentativa de quitar obrigações não contratuais anteriores, sem perder os IDs originais.
            const previous = [...(snapshot.financialCycles || [])].filter(c=>c.era===cfg.financialEra && c.cycle===cycle-1)[0];
            (previous?.pending || []).filter(p=>p.kind!=='loan').forEach(p=>transfer(p.from,p.to,p.amount,p.kind,p.label,p.obligationId));
            // Despesas recorrentes: valores percentuais aplicados sobre a renda/receita do ciclo, nunca sobre saldo negativo.
            const expenses = (account, list, base, identity, isResident=false) => (list || []).forEach((ex, i) => {
                if(isResident && shouldSkipGenericRentExpense(identity, ex, cfg.genericRentExpenseName, snapshot.rentals || [])) return;
                const amount = ex.type === 'percent' ? simMoney(base * check(ex.value, 'despesa percentual') / 100) : check(ex.value || 0, 'despesa fixa');
                transfer(account, 'external', amount, 'expense', ex.name || 'Despesa fixa', `expense:${identity}:${i}:${cycle}`);
            });
            active.forEach(r => expenses(simFinAccount('residents', r.id), r.fixedExpenses, grossIncome.get(r.id), r.id, true));
            snapshot.businesses.filter(b => !b.isPublicBody && b.sector !== 'Governamental').forEach(b => expenses(simFinAccount('businesses', b.id), b.fixedExpenses, bizRevenue.get(b.id), b.id, false));
            active.forEach(r => {
                const base = grossIncome.get(r.id);
                transfer(simFinAccount('residents', r.id), 'external', simMoney(base * check(cfg.costOfLiving || 0, 'custo de vida') / 100), 'consumption', 'Custo de vida (consumo externo)', `living:${r.id}:${cycle}`);
                transfer(simFinAccount('residents', r.id), 'external', simMoney(base * check(cfg.foodTax || 0, 'taxa de alimentação') / 100), 'consumption', 'Consumo de alimentação externo', `food:${r.id}:${cycle}`);
            });
            const commercialChanges = new Map();
            [...snapshot.subscriptions].filter(sub=>sub.active!==false && Number(sub.startCycle||1)<=cycle).sort((a,b) => a.id.localeCompare(b.id)).forEach(sub => {
                const subscriber = sub.subscriberType === 'resident' ? simFinAccount('residents', sub.subscriberId) : sub.subscriberType === 'business' ? simFinAccount('businesses', sub.subscriberId) : 'treasury';
                const provider = snapshot.businesses.find(b => b.id === sub.providerId);
                const receiver = provider?.isPublicBody ? 'treasury' : simFinAccount('businesses', sub.providerId);
                const amount=check(resolveRecurringPrice(sub,{value:sub.planValue},cycle),'assinatura');
                const okay=transfer(subscriber, receiver, amount, 'subscription', sub.planName || 'Assinatura', `subscription:${sub.id}:${cycle}`);
                const processed=Number(sub.cyclesProcessed||0)+(okay?1:0), duration=Number(sub.durationCycles||0);
                commercialChanges.set(`subscriptions:${sub.id}`,{cyclesProcessed:processed,active:duration>0&&processed>=duration?false:true,lastProcessedCycle:cycle,...(sub.pendingPrice!==undefined&&Number(sub.priceEffectiveFromCycle||Infinity)<=cycle?{price:sub.pendingPrice,planValue:sub.pendingPrice,pendingPrice:null,priceEffectiveFromCycle:null}:{})});
            });
            [...(snapshot.consumptionPackages||[])].filter(pkg=>pkg.active!==false && Number(pkg.effectiveFromCycle||1)<=cycle).sort((a,b)=>a.id.localeCompare(b.id)).forEach(pkg=>{
                const provider=snapshot.businesses.find(b=>b.id===pkg.businessId); if(!provider)return;
                const receiver=provider.isPublicBody?'treasury':simFinAccount('businesses',pkg.businessId);
                active.filter(r=>isPackageEligibleForResident(pkg,r,cycle,snapshot)).sort((a,b)=>a.id.localeCompare(b.id)).forEach(r=>{ const effectiveNew=pkg.pendingPrice!==undefined&&Number(pkg.priceEffectiveFromCycle||Infinity)<=cycle; const grandfather=(effectiveNew?(pkg.pendingGrandfatheredPrices||pkg.grandfatheredPrices||{}):(pkg.grandfatheredPrices||{})); const amount=grandfather[r.id]!==undefined?Number(grandfather[r.id]):effectiveNew?Number(pkg.pendingPrice):Number(pkg.price||0); transfer(simFinAccount('residents',r.id),receiver,check(amount,'pacote'),'package',pkg.name||'Pacote de consumo',`package:${pkg.id}:${r.id}:${cycle}`); });
                if(pkg.pendingPrice!==undefined&&Number(pkg.priceEffectiveFromCycle||Infinity)<=cycle) commercialChanges.set(`consumptionPackages:${pkg.id}`,{price:pkg.pendingPrice,pendingPrice:null,priceEffectiveFromCycle:null,grandfatheredPrices:pkg.pendingGrandfatheredPrices||pkg.grandfatheredPrices||{},pendingGrandfatheredPrices:null});
                if(Number(pkg.durationCycles||0)>0 && cycle>=Number(pkg.startCycle||pkg.effectiveFromCycle||1)+Number(pkg.durationCycles)-1) commercialChanges.set(`consumptionPackages:${pkg.id}`,{...(commercialChanges.get(`consumptionPackages:${pkg.id}`)||{}),active:false,endedCycle:cycle});
            });
            [...(snapshot.rentals||[])].filter(r=>r.active!==false && Number(r.startCycle||1)<=cycle).sort((a,b)=>a.id.localeCompare(b.id)).forEach(rental=>{
                const from=assetAccountKey(rental.tenantType,rental.tenantId), to=assetAccountKey(rental.landlordType,rental.landlordId);
                if(!from||!to) { pending.push({kind:'rent',label:'Aluguel',amount:Number(rental.amount||0),obligationId:`rent:${rental.id}:${cycle}`,from:from||'missing',to:to||'missing',reason:'Conta de aluguel inválida'}); return; }
                transfer(from,to,check(rental.amount,'aluguel'),'rent',`Aluguel: ${snapshot.assets?.find(a=>a.id===rental.assetId)?.name||'Patrimônio'}`,`rent:${rental.id}:${cycle}`);
            });
            [...snapshot.loans].filter(l => l.status !== 'anistiado' && l.status !== 'quitado' && (l.remainingAmount || 0) > 0).sort((a,b) => a.id.localeCompare(b.id)).forEach(loan => {
                const total=Number(loan.totalInstallments),paid=Number(loan.currentInstallment || 0);
                if(!Number.isInteger(total)||total<1||!Number.isInteger(paid)||paid<0||paid>=total) throw new Error(`Contrato inválido: ${loan.id}`);
                let remaining=check(loan.remainingAmount,'saldo devedor');
                const due=Math.min(total-paid,Math.max(1,Number(loan.overdueInstallments||0)+1));
                let completed=0;
                const history=[...(loan.paymentHistory||[])];
                for(let i=0;i<due;i++){
                    const installment=paid+completed+1;
                    const amount=installment===total?remaining:simMoney(remaining/(total-paid-completed));
                    const okay=transfer(simFinAccount(loan.borrowerType,loan.borrowerId),simFinAccount('businesses',loan.bankId),amount,'loan',`Parcela ${installment}/${total}`,`loan:${loan.id}:${installment}`);
                    if(!okay)break;
                    remaining=simMoney(remaining-amount);completed++;
                    history.push({cycle,installment,amount,status:'paga'});
                }
                const overdue=due-completed;
                loanChanges.set(loan.id,{remainingAmount:remaining,currentInstallment:paid+completed,overdueInstallments:overdue,status:paid+completed===total?'quitado':overdue?'atrasado':'ativo',paymentHistory:history,lastMissedCycle:overdue?cycle:null});
            });
            const emitted = simMoney(entries.filter(e => e.from === 'external').reduce((s,e) => s+e.amount, 0));
            const removed = simMoney(entries.filter(e => e.to === 'external').reduce((s,e) => s+e.amount, 0));
            const initialTotal = simMoney([...starting.values()].reduce((s,v) => s+v, 0));
            const finalTotal = simMoney([...balances.values()].reduce((s,v) => s+v, 0));
            if (Math.abs(simMoney(finalTotal - initialTotal - emitted + removed)) > .02) throw new Error('Falha de conciliação monetária.');
            return { cycle, era: cfg.financialEra, negativeLimit: limitValue, balances, starting, entries, pending, loanChanges, commercialChanges, emitted, removed, initialTotal, finalTotal,
                totalTaxRevenue: simMoney(entries.filter(e=>e.kind==='tax').reduce((s,e)=>s+e.amount,0)), totalGovSalaries:simMoney(entries.filter(e=>e.kind==='salary'&&e.from==='treasury').reduce((s,e)=>s+e.amount,0)),
                totalCirculating:simMoney([...balances].filter(([key])=>key!=='treasury').reduce((s,[,v])=>s+v,0)) };
        }

        function simAccountLabel(key) {
            if(key==='treasury') return 'Tesouro Municipal';
            if(key==='external') return 'Economia Externa';
            const [type,id]=String(key||'').split(':');
            if(type==='residents'){const r=state.residents.find(x=>x.id===id);return r?`${r.firstName} ${r.lastName}`:'Morador removido';}
            if(type==='businesses'){const b=state.businesses.find(x=>x.id===id);return b?.name||'Empresa removida';}
            return key||'Conta';
        }

        function simPreviewHTML(plan) {
            return `<div class="bg-[--card-bg] border border-[--border-color] rounded-xl p-4 mt-4 space-y-3">
                <h3 class="font-bold text-lg">Prévia · Ciclo ${plan.cycle} da Nova Era</h3>
                <p class="text-sm">${plan.entries.length} operações previstas · ${plan.pending.length} obrigações pendentes.</p><p class="text-sm">Planos: ${plan.entries.filter(e=>e.kind==='subscription').length} · Pacotes: ${plan.entries.filter(e=>e.kind==='package').length} · Cobranças comerciais bloqueadas: ${plan.pending.filter(e=>['subscription','package'].includes(e.kind)).length} · Receita comercial prevista: 🪙 ${plan.entries.filter(e=>['subscription','package'].includes(e.kind)&&e.to.startsWith('businesses:')).reduce((a,e)=>a+e.amount,0).toLocaleString('pt-BR')}</p>
                <p class="text-sm">Emissão externa: 🪙 ${plan.emitted.toLocaleString('pt-BR')} · Consumo externo: 🪙 ${plan.removed.toLocaleString('pt-BR')}</p>
                <p class="text-sm">Arrecadação: 🪙 ${plan.totalTaxRevenue.toLocaleString('pt-BR')} · Saldo final do Tesouro: 🪙 ${plan.balances.get('treasury').toLocaleString('pt-BR')}</p>
                ${plan.pending.length ? `<div class="bg-yellow-50 text-yellow-900 rounded p-3 text-xs max-h-40 overflow-y-auto"><strong>Obrigações não pagas:</strong>${plan.pending.map(p=>`<p>${simEsc(p.label)} · 🪙 ${p.amount.toLocaleString('pt-BR')} · ${simEsc(p.reason)}</p>`).join('')}</div>` : ''}
                <details class="text-xs"><summary class="font-bold cursor-pointer">Ver movimentações e saldos</summary><div class="max-h-64 overflow-y-auto mt-2">${plan.entries.map(e=>`<p class="border-b py-1">${simEsc(e.label)} · ${simEsc(simAccountLabel(e.from))} &rarr; ${simEsc(simAccountLabel(e.to))} · 🪙 ${e.amount.toLocaleString('pt-BR')}</p>`).join('')}${[...plan.balances].map(([key,value])=>`<p class="py-1 font-bold">${simEsc(simAccountLabel(key))}: 🪙 ${value.toLocaleString('pt-BR')}</p>`).join('')}</div></details>
                <button data-action="confirm-finance-cycle" class="w-full py-3 rounded-lg bg-green-700 text-white font-bold">Confirmar e processar ciclo</button>
                <button data-action="discard-finance-preview" class="w-full py-2 rounded-lg border border-[--border-color]">Cancelar prévia</button>
            </div>`;
        }

        async function processManualSale(businessId, productId, buyerType, buyerId, quantity) {
            const product=state.products.find(p=>p.id===productId&&p.businessId===businessId), business=state.businesses.find(b=>b.id===businessId);
            const validation=validateProductSale(product,quantity); if(!validation.ok) throw new Error(validation.reason);
            if(!business) throw new Error('Empresa não encontrada.');
            const totals=calculateSaleTotals(product,quantity), cfg=state.financeConfig, limit=Number(cfg.negativeLimit??15000);
            const buyer = buyerType==='resident'?state.residents.find(r=>r.id===buyerId):buyerType==='business'?state.businesses.find(b=>b.id===buyerId):null;
            const buyerBalance=buyerType==='treasury'?Number(cfg.treasuryBalance||0):Number(buyer?.balance||0);
            if(buyerType!=='treasury'&&!canDebitWithGlobalLimit(buyerBalance,totals.grossRevenue,limit)) throw new Error('Compra recusada: limite negativo excedido.');
            const stockAfter=product.stockEnabled?Number(product.stockQty)-Number(quantity):null, balanceAfter=simMoney(buyerBalance-totals.grossRevenue);
            if(!confirm(`Prévia da venda\nValor: 🪙 ${totals.grossRevenue.toLocaleString('pt-BR')}\nSaldo do comprador: 🪙 ${buyerBalance.toLocaleString('pt-BR')} → 🪙 ${balanceAfter.toLocaleString('pt-BR')}\n${product.stockEnabled?`Estoque: ${product.stockQty} → ${stockAfter}\n`:''}Custo: 🪙 ${totals.costOfGoods.toLocaleString('pt-BR')}\nLucro bruto: 🪙 ${totals.grossProfit.toLocaleString('pt-BR')}\n\nConfirmar?`)) return;
            const productRef=doc(db,'products',productId), bizRef=doc(db,'businesses',businessId), cfgRef=doc(db,'config','finance');
            await runTransaction(db,async tx=>{
                const snaps=[await tx.get(productRef),await tx.get(bizRef),await tx.get(cfgRef)]; const liveProduct=snaps[0].data(), liveBiz=snaps[1].data(), liveCfg=snaps[2].data()||{};
                let buyerRef=null,buyerSnap=null;if(buyerType==='resident')buyerRef=doc(db,'residents',buyerId);else if(buyerType==='business')buyerRef=doc(db,'businesses',buyerId);if(buyerRef)buyerSnap=await tx.get(buyerRef);
                const v=validateProductSale(liveProduct,quantity);if(!v.ok)throw new Error(v.reason); const liveTotals=calculateSaleTotals(liveProduct,quantity);
                const liveBuyerBal=buyerType==='treasury'?Number(liveCfg.treasuryBalance||0):Number(buyerSnap?.data()?.balance||0); if(buyerType!=='treasury'&&!canDebitWithGlobalLimit(liveBuyerBal,liveTotals.grossRevenue,Number(liveCfg.negativeLimit??15000)))throw new Error('Limite negativo excedido.');
                const receiverTreasury=!!liveBiz.isPublicBody||liveBiz.sector==='Governamental';
                let treasuryNext=Number(liveCfg.treasuryBalance||0), circulatingDelta=0;
                if(buyerType==='treasury'){treasuryNext=simMoney(treasuryNext-liveTotals.grossRevenue);circulatingDelta+=receiverTreasury?0:liveTotals.grossRevenue;} else {tx.update(buyerRef,{balance:simMoney(liveBuyerBal-liveTotals.grossRevenue)});if(receiverTreasury)circulatingDelta-=liveTotals.grossRevenue;}
                if(receiverTreasury) treasuryNext=simMoney(treasuryNext+liveTotals.grossRevenue); else tx.update(bizRef,{balance:simMoney(Number(liveBiz.balance||0)+liveTotals.grossRevenue)});
                if(buyerType==='treasury'||receiverTreasury)tx.update(cfgRef,{treasuryBalance:treasuryNext,totalCirculating:simMoney(Number(liveCfg.totalCirculating||0)+circulatingDelta)});
                if(liveProduct.stockEnabled)tx.update(productRef,{stockQty:Number(liveProduct.stockQty)-Number(quantity),updatedAt:serverTimestamp()});
                const buyerName=buyerType==='resident'?`${buyerSnap.data().firstName} ${buyerSnap.data().lastName}`:buyerType==='business'?buyerSnap.data().name:'Tesouro Municipal';
                const saleRef=doc(collection(db,'sales')), ftRef=doc(collection(db,'financialTransactions'));
                tx.set(saleRef,{businessId,buyerType,buyerId, buyerName,productId,productName:liveProduct.name,quantity:Number(quantity),unitPrice:Number(liveProduct.salePrice||0),unitCost:Number(liveProduct.unitCost||0),grossRevenue:liveTotals.grossRevenue,costOfGoods:liveTotals.costOfGoods,grossProfit:liveTotals.grossProfit,cycle:Number(liveCfg.cycleNumber||0),era:liveCfg.financialEra||null,createdAt:serverTimestamp()});
                tx.set(ftRef,{from:buyerType==='treasury'?'treasury':simFinAccount(buyerType==='resident'?'residents':'businesses',buyerId),to:receiverTreasury?'treasury':simFinAccount('businesses',businessId),amount:liveTotals.grossRevenue,label:`Venda: ${liveProduct.name} ×${quantity}`,kind:'product_sale',businessId,cycle:Number(liveCfg.cycleNumber||0),era:liveCfg.financialEra||null,date:serverTimestamp()});
            });
        }
        async function processExtraRevenue(businessId, description, amount, originCategory) {

            const biz=state.businesses.find(b=>b.id===businessId); if(!biz)throw new Error('Empresa não encontrada.');

        async function simManualMoney(from, to, rawAmount, label, extra = null) {
            const amount=Number(rawAmount);
            if (!Number.isFinite(amount) || amount <= 0) throw new Error('Informe um valor maior que zero.');
            if(from===to) throw new Error('Origem e destino iguais.');
            const refFor=key=>key==='treasury'?doc(db,'config','finance'):key==='external'?null:doc(db,...key.split(':'));
            const fromRef=refFor(from),toRef=refFor(to),entryRef=doc(collection(db,'financialTransactions'));
            await runTransaction(db,async tx=>{
                const fromDoc=fromRef?await tx.get(fromRef):null;
                const toDoc=toRef?await tx.get(toRef):null;
                const config=await tx.get(doc(db,'config','finance'));
                if(!config.data()?.financialEra) throw new Error('Nova Era não iniciada.');
                if(fromDoc && !fromDoc.exists() || toDoc && !toDoc.exists()) throw new Error('Conta não encontrada.');
                const getBalance=(key,snap)=>key==='treasury'?Number(config.data().treasuryBalance||0):Number(snap?.data()?.balance||0);
                const fromValue=fromRef?getBalance(from,fromDoc):0;
                const toValue=toRef?getBalance(to,toDoc):0;
                const next=simMoney(fromValue-amount);
                const credit=simMoney(toValue+amount);
                if(from!=='external' && from!=='treasury' && next< -Number(config.data().negativeLimit ?? 15000)) throw new Error('Limite negativo excedido.');
                if(fromRef && from!=='treasury') tx.update(fromRef,{balance:next});
                if(toRef && to!=='treasury') tx.update(toRef,{balance:credit});
                const isPrivate=key=>key.startsWith('residents:')||key.startsWith('businesses:');
                const circulationChange=simMoney((isPrivate(to)?amount:0)-(isPrivate(from)?amount:0));
                const configurationUpdate={};
                if(from==='treasury') configurationUpdate.treasuryBalance=next;
                if(to==='treasury') configurationUpdate.treasuryBalance=credit;
                if(circulationChange) configurationUpdate.totalCirculating=simMoney((config.data().totalCirculating||0)+circulationChange);
                if(Object.keys(configurationUpdate).length)tx.update(doc(db,'config','finance'),configurationUpdate);
                tx.set(entryRef,{from,to,amount:simMoney(amount),label,kind:extra?.history?'investment':'manual',era:config.data().financialEra,cycle:Number(config.data().cycleNumber||0),date:serverTimestamp()});
                if(extra?.collection) tx.set(doc(collection(db,extra.collection)),extra.data);
                if(extra?.history){
                    const h=extra.history;
                    tx.set(doc(collection(db,'historyEvents')),{title:h.title,description:h.description||'',category:'finance',cycle:Number(config.data().cycleNumber||0),era:config.data().financialEra,residentIds:h.residentIds||[],businessIds:h.businessIds||[],regionIds:h.regionIds||[],assetIds:[],importance:'important',manual:false,amount:simMoney(amount),createdAt:serverTimestamp()});
                }
            });
        }

        async function simCommitCycle() {
            if (simCycleBusy || !simCyclePreview) return;
            const plan = simCyclePreview;
            if(JSON.stringify({entries:plan.entries,pending:plan.pending}).length>750000){alert('Ciclo muito grande para o documento único. Nenhum dado alterado.');return;}
            simCycleBusy = true;
            try {
                const accountRefs = [...plan.balances.keys()].filter(k => k !== 'treasury').map(key => {
                    const split = key.indexOf(':'); return { key, ref: doc(db, key.slice(0,split), key.slice(split+1)) };
                });
                if (accountRefs.length + plan.loanChanges.size + (plan.commercialChanges?.size||0) + plan.pending.filter(p=>['subscription','package'].includes(p.kind)).length + 3 > 400) throw new Error('Cidade excede o limite de operações da versão compacta. Nenhum dado foi alterado.');
                const configRef=doc(db,'config','finance'), cycleRef=doc(db,'financialCycles',`${plan.era}-${plan.cycle}`);
                const indicatorPayload=simBuildIndicatorSnapshot(plan), indicatorRef=doc(db,'indicatorSnapshots',`${plan.era}-${plan.cycle}`);
                await runTransaction(db, async tx => {
                    // Firestore exige que TODAS as leituras sejam feitas antes de qualquer escrita.
                    const configDoc=await tx.get(configRef), cycleDoc=await tx.get(cycleRef);
                    const currentConfig=configDoc.data() || {};
                    if (cycleDoc.exists() || currentConfig.financialEra !== plan.era || Number(currentConfig.cycleNumber || 0)+1 !== plan.cycle) throw new Error('Ciclo já executado ou economia alterada; gere outra prévia.');
                    const accountDocs=[];
                    for (const item of accountRefs) accountDocs.push(await tx.get(item.ref));
                    const loanRefs=[...plan.loanChanges.keys()].map(id=>doc(db,'loans',id));
                    const loanDocs=[]; for(const ref of loanRefs) loanDocs.push(await tx.get(ref));
                    if (simMoney(currentConfig.treasuryBalance || 0) !== plan.starting.get('treasury')) throw new Error('Tesouro alterado; gere outra prévia.');
                    if (simMoney(currentConfig.negativeLimit ?? 15000) !== plan.negativeLimit || simMoney(currentConfig.externalRevenueValue || 0) !== simMoney(state.financeConfig.externalRevenueValue || 0) || simMoney(currentConfig.costOfLiving||0)!==simMoney(state.financeConfig.costOfLiving||0)||simMoney(currentConfig.foodTax||0)!==simMoney(state.financeConfig.foodTax||0)) throw new Error('Parâmetros modificados; gere outra prévia.');
                    accountDocs.forEach((snap,i)=>{if(!snap.exists() || simMoney(snap.data().balance || 0)!==plan.starting.get(accountRefs[i].key)) throw new Error('Saldos alterados; gere outra prévia.');});
                    loanDocs.forEach((snap,i)=>{const id=loanRefs[i].id, original=state.loans.find(l=>l.id===id); if(!snap.exists()|| simMoney(snap.data().remainingAmount||0)!==simMoney(original.remainingAmount||0)||Number(snap.data().currentInstallment||0)!==Number(original.currentInstallment||0)) throw new Error('Empréstimo alterado; gere outra prévia.');});
                    accountRefs.forEach(item=>{ if(plan.balances.get(item.key)!==plan.starting.get(item.key)) tx.update(item.ref,{balance:plan.balances.get(item.key)}); });
                    loanRefs.forEach((ref,i)=>tx.update(ref,plan.loanChanges.get(ref.id)));
                    for(const [key,changes] of (plan.commercialChanges||new Map())) { const [col,id]=key.split(':'); tx.update(doc(db,col,id),changes); }
                    plan.pending.filter(p=>['subscription','package'].includes(p.kind)).forEach(p=>tx.set(doc(db,'commercialPendingCharges',`${plan.era}-${plan.cycle}-${String(p.obligationId||'pending').replace(/[^a-zA-Z0-9_-]/g,'_')}`),{...p,era:plan.era,cycle:plan.cycle,status:'pending',createdAt:serverTimestamp()}));
                    tx.update(configRef,{cycleNumber:plan.cycle,treasuryBalance:plan.balances.get('treasury'),totalCirculating:plan.totalCirculating,lastCycle:serverTimestamp()});
                    tx.set(cycleRef,{era:plan.era,cycle:plan.cycle,date:serverTimestamp(),entries:plan.entries,pending:plan.pending,emitted:plan.emitted,removed:plan.removed,initialTotal:plan.initialTotal,finalTotal:plan.finalTotal,totalCollected:plan.totalTaxRevenue,totalSpent:plan.totalGovSalaries,balance:plan.balances.get('treasury')});
                    tx.set(indicatorRef,{...indicatorPayload,createdAt:serverTimestamp()});
                });
                simCyclePreview=null;
                alert(`Ciclo ${plan.cycle} realizado e registrado!`);
                render();
            } catch (error) { console.error(error); alert(`Ciclo NÃO concluído: ${error.message}`); simCyclePreview=null; render(); }
            finally { simCycleBusy=false; }
        }

        async function simOpenNewEra(treasuryInitial, residentInitial, businessInitial, assetsMode='preserve', rentalsMode='preserve') {
            if (!Object.values(state.dataLoaded).every(Boolean)) throw new Error('Aguarde os dados carregarem.');
            if ([treasuryInitial,residentInitial,businessInitial].some(n=>!simValidMoney(n))) throw new Error('Valores iniciais inválidos.');
            if (!['preserve','delete'].includes(assetsMode)||!['preserve','end'].includes(rentalsMode)) throw new Error('Opções da Nova Era inválidas.');
            if (!window.confirm('Confirma que fez e verificou um BACKUP dos dados antes de continuar?')) return;
            if (!window.confirm('ÚLTIMA CONFIRMAÇÃO: encerrar a Era atual, reiniciar saldos e anistiar empréstimos ativos?')) return;
            const mutableRentals=assetsMode==='delete'?state.rentals:(rentalsMode==='end'?state.rentals.filter(r=>r.active!==false):[]);
            const writeEstimate=state.residents.length*2+state.businesses.length*2+state.loans.length*2+(assetsMode==='delete'?state.assets.length:0)+mutableRentals.length+8;
            if(state.residents.some(r=>JSON.stringify(r).length>350000)||state.businesses.some(b=>JSON.stringify(b).length>350000)) throw new Error('Há registros grandes demais para arquivamento direto. Nenhum dado alterado.');
            if(writeEstimate>380) throw new Error('Há registros demais para reiniciar a Era de forma atômica neste HTML. Nenhum dado foi alterado.');
            const configRef=doc(db,'config','finance');
            await runTransaction(db, async tx=>{
                const config=await tx.get(configRef);
                if(!config.exists()) throw new Error('Configuração financeira não encontrada.');
                const cfg=config.data()||{}, oldEra=cfg.financialEra||null, baseSeq=cfg.eraSequence!==undefined?Number(cfg.eraSequence||0):(oldEra?1:0), seq=baseSeq+1, era=`ERA-${seq}`;
                const eraRef=doc(db,'financialEras',era);
                const existing=await tx.get(eraRef); if(existing.exists()) throw new Error('Identificador da nova Era já existe. Recarregue.');
                const residents=[], businesses=[], loans=[], assets=[], rentals=[];
                for(const r of state.residents) residents.push(await tx.get(doc(db,'residents',r.id)));
                for(const b of state.businesses) businesses.push(await tx.get(doc(db,'businesses',b.id)));
                for(const l of state.loans) loans.push(await tx.get(doc(db,'loans',l.id)));
                if(assetsMode==='delete') for(const a of state.assets) assets.push(await tx.get(doc(db,'assets',a.id)));
                for(const r of mutableRentals) rentals.push(await tx.get(doc(db,'rentals',r.id)));
                if([...residents,...businesses,...loans,...assets,...rentals].some(s=>!s.exists())) throw new Error('Cadastro alterado durante a preparação. Recarregue e tente novamente.');
                if(oldEra){
                    const oldEraRef=doc(db,'financialEras',oldEra),oldEraSnap=await tx.get(oldEraRef);
                    if(oldEraSnap.exists()) tx.update(oldEraRef,{endedAt:serverTimestamp(),finalTreasury:Number(cfg.treasuryBalance||0),finalCycle:Number(cfg.cycleNumber||0),status:'encerrada'});
                }
                state.residents.forEach((r,i)=>{
                    const old=residents[i].data();
                    tx.set(doc(db,'financialArchives',`${era}-resident-${r.id}`),{eraClosed:oldEra||'legado',newEra:era,kind:'resident',originalId:r.id,oldBalance:old.balance||0,archivedAt:serverTimestamp()});
                    tx.update(residents[i].ref,{balance:simMoney(residentInitial)});
                });
                state.businesses.forEach((b,i)=>{
                    const old=businesses[i].data();
                    tx.set(doc(db,'financialArchives',`${era}-business-${b.id}`),{eraClosed:oldEra||'legado',newEra:era,kind:'business',originalId:b.id,oldBalance:old.balance||0,archivedAt:serverTimestamp()});
                    tx.update(businesses[i].ref,{balance:simMoney(businessInitial)});
                });
                state.loans.forEach((l,i)=>{
                    const old=loans[i].data();
                    tx.set(doc(db,'financialArchives',`${era}-loan-${l.id}`),{eraClosed:oldEra||'legado',newEra:era,kind:'loan',originalId:l.id,remainingBeforeAmnesty:old.remainingAmount||0,statusBefore:old.status||null,archivedAt:serverTimestamp()});
                    if(old.status!=='quitado'&&Number(old.remainingAmount||0)>0) tx.update(loans[i].ref,{status:'anistiado',remainingAmount:0,amnestiedAt:serverTimestamp(),remainingBeforeAmnesty:old.remainingAmount||0});
                });
                if(assetsMode==='delete') assets.forEach(s=>tx.delete(s.ref));
                rentals.forEach(s=>assetsMode==='delete'?tx.delete(s.ref):tx.update(s.ref,{active:false,endedAt:serverTimestamp(),endReason:'Encerrado na abertura de nova Era'}));
                const total=simMoney(treasuryInitial+state.residents.length*residentInitial+state.businesses.length*businessInitial);
                tx.set(eraRef,{era,sequence:seq,status:'ativa',createdAt:serverTimestamp(),previousEra:oldEra,previousTreasury:Number(cfg.treasuryBalance||0),residents:state.residents.length,businesses:state.businesses.length,treasuryInitial,residentInitial,businessInitial,totalEmission:total,assetsMode,rentalsMode});
                tx.set(configRef,{...cfg,financialEra:era,eraSequence:seq,cycleNumber:0,negativeLimit:Number(cfg.negativeLimit??15000),lastCycle:null,treasuryBalance:simMoney(treasuryInitial),totalCirculating:simMoney(state.residents.length*residentInitial+state.businesses.length*businessInitial),externalRevenueValue:Number(cfg.externalRevenueValue||0)});
                tx.set(doc(collection(db,'historyEvents')),{title:'Nova Era Financeira inaugurada',description:`${simEraDisplay(era)} iniciada. A História da Cidade permanece contínua.`,category:'finance',cycle:0,era,residentIds:[],businessIds:[],regionIds:[],assetIds:[],importance:'important',manual:false,createdAt:serverTimestamp()});
            });
        }

        async function finalizeElection(winnerId) {
            const { type, ministryId, ministryName, isTestMode, votes, candidates, round } = state.election;
            if (!isTestMode) {
                const voteCount = (votes || []).reduce((acc, v) => { acc[v.candidateId] = (acc[v.candidateId] || 0) + 1; return acc; }, {});
                await addDoc(collection(db, "electionHistory"), { type, ministryId, ministryName, winnerId, winnerVotes: voteCount[winnerId] || 0, totalVotes: (votes || []).length, votes: (votes || []), candidates: (candidates || []), date: serverTimestamp(), round: round || 1 });
                if (type === 'prefeito') await handleAppointMinister('prefeito', 'Prefeito(a)', winnerId);
                else await handleAppointMinister(ministryId, ministryName, winnerId);
            }
            await setDoc(doc(db, "election", "current"), { isActive: false });
            if(!isTestMode) await simRecordHistoryEvent({title:`Resultado eleitoral: ${simResidentName(winnerId)}`,description:type==='prefeito'?'Eleito(a) Prefeito(a).':`Eleito(a) para ${ministryName||'ministério'}.`,category:'politics',residentIds:[winnerId],importance:'important'});
        }

        function generateElectionReport() {
            const { votes, candidates, type, ministryName, round } = state.election;
            const typeLabel = type === 'prefeito' ? 'Prefeito(a)' : `Ministro(a) (${ministryName})`;
            const roundLabel = round === 2 ? '2º Turno' : '1º Turno';
            const curVotes = votes || [];
            let out = `### RELATÓRIO PARCIAL DE ELEIÇÃO: ${typeLabel} - ${roundLabel}\n\n`;
            const results = (candidates || []).map(c => {
                const sim = state.residents.find(x => x.id === c.id);
                const party = state.parties.find(p => p.id === sim?.partyId);
                const myVotes = curVotes.filter(v => v.candidateId === c.id);
                const votersNames = myVotes.map(v => { const vs = state.residents.find(x => x.id === v.voterId); return vs ? `${vs.firstName} ${vs.lastName}` : 'Anônimo'; });
                return { name: sim ? `${sim.firstName} ${sim.lastName}` : 'Desconhecido', party: party ? party.name : 'Sem Partido', count: myVotes.length, voters: votersNames };
            }).sort((a,b) => b.count - a.count);
            results.forEach(res => { out += `CANDIDATO: ${res.name} (${res.party})\nVOTOS: ${res.count}\nVOTANTES: ${res.voters.join(", ") || 'Nenhum'}\n\n`; });
            state.currentPage = 'register'; render();
            const textarea = document.getElementById('report-textarea');
            const output = document.getElementById('report-output');
            if (textarea && output) { textarea.value = out; output.classList.remove('hidden'); }
        }

            if (reason === 'Morreu') {
                const person=state.residents.find(r=>r.id===resId);
                await updateDoc(doc(db, "residents", resId), { isDeceased: true, deathDate: new Date(), employment: [] });

                await deleteDoc(doc(db, "residents", resId));

                    if (r.relationships?.some(rel => rel.residentId === resId)) {
                        const newRels = r.relationships.filter(rel => rel.residentId !== resId);
                        await updateDoc(doc(db, "residents", r.id), { relationships: newRels });

        async function handleRemoveEmployee(residentId, businessId, reason) {
            const residentRef = doc(db, "residents", residentId);
            const residentDoc = await getDoc(residentRef);
            const resident = residentDoc.data(); if (!resident) return;
            const newEmployment = normalizeEmployment(resident.employment).filter(job => job.businessId !== businessId);
            const updates = { employment: newEmployment };
            if (reason !== 'Apenas remoção') {
                const business = state.businesses.find(b => b.id === businessId);
                const historyEntry = { id: crypto.randomUUID(), type: 'job', status: reason, location: business ? business.name : 'Empresa Desconhecida', date: new Date() };
                updates.history = [...(resident.history || []), historyEntry];
            }
            await updateDoc(residentRef, updates);
            const business=state.businesses.find(b=>b.id===businessId);
            await simRecordHistoryEvent({title:`${simResidentName(residentId)} deixou ${business?.name||'a empresa'}`,description:reason||'Vínculo encerrado.',category:'employment',residentIds:[residentId],businessIds:[businessId],regionIds:business?.regionId?[business.regionId]:[]});
        }

        async function handleRemoveMinister(residentId, officeId, officeName, reason) {
            const batch = writeBatch(db);
            const residentRef = doc(db, "residents", residentId);
            const residentDoc = await getDoc(residentRef);
            const resident = residentDoc.data(); if (!resident) return;
            const newRoles = { ...state.government.roles };
            delete newRoles[officeId]; batch.set(doc(db, "government", "roles"), newRoles);
            const updates = { governmentRole: null };
            if (reason !== 'Apenas remoção') {
                const historyEntry = { id: crypto.randomUUID(), type: 'government', status: reason, location: officeName, date: new Date() };
                updates.history = [...(resident.history || []), historyEntry];
            }
            batch.update(residentRef, updates); await batch.commit();
        }

        async function handleDeleteHistoryEntry(residentId, historyId) {
            const residentRef = doc(db, "residents", residentId);
            const residentDoc = await getDoc(residentRef);
            const resident = residentDoc.data(); if (!resident || !resident.history) return;
            const newHistory = resident.history.filter(entry => entry.id !== historyId);
            await updateDoc(residentRef, { history: newHistory });
        }

        async function handleDeleteResident(id) {
            const batch = writeBatch(db); batch.delete(doc(db, "residents", id));
            state.residents.forEach(r => {
                if (r.id !== id && r.relationships?.some(rel => rel.residentId === id)) {
                    const newRelationships = r.relationships.filter(rel => rel.residentId !== id);
                    batch.update(doc(db, "residents", r.id), { relationships: newRelationships });
                }
            });
            const ownedBusiness = state.businesses.find(b => b.ownerId === id);
            if (ownedBusiness) batch.update(doc(db, "businesses", ownedBusiness.id), { ownerId: null });
            const partyPresident = state.parties.find(p => p.id === id);
            if (partyPresident) batch.update(doc(db, "parties", partyPresident.id), { presidentId: null });
            Object.entries(state.government.roles || {}).forEach(([roleId, holderId]) => {
                if (holderId === id) {
                    const newRoles = { ...state.government.roles };
                    delete newRoles[roleId]; batch.set(doc(db, "government", "roles"), newRoles);
                }
            });
            state.councils.forEach(c => {
                if (c.presidentId === id) batch.update(doc(db, "councils", c.id), { presidentId: null });
                if (c.councilorIds?.includes(id)) {
                    const newCouncilors = c.councilorIds.filter(cid => cid !== id);
                    batch.update(doc(db, "councils", c.id), { councilorIds: newCouncilors });
                }
            });
            await batch.commit();
        }

        async function handleDeleteRegion(id) {
            const batch = writeBatch(db); batch.delete(doc(db, "regions", id));
            state.residents.forEach(r => { if (r.regionId === id) batch.update(doc(db, "residents", r.id), { regionId: null }); });
            state.businesses.forEach(b => { if (b.regionId === id) batch.update(doc(db, "businesses", b.id), { regionId: null }); });
            await batch.commit();
        }

        async function updateResidentCouncilRoles(batch, residentId, councilId, councilName, newRole) {
            if (!residentId) return;
            const residentRef = doc(db, "residents", residentId);
            const resDoc = await getDoc(residentRef);
            const resident = resDoc.data(); if (!resident) return;
            let councilRoles = resident.councilRoles || [];
            councilRoles = councilRoles.filter(r => r.councilId !== councilId);
            if (newRole) councilRoles.push({ councilId, councilName, role: newRole });
            batch.update(residentRef, { councilRoles });
        }

        async function handleRemoveCouncilorWithReason(residentId, councilId, reason) {
            const batch = writeBatch(db);
            const councilRef = doc(db, "councils", councilId);
            const council = state.councils.find(c => c.id === councilId); if (!council) return;
            const newCouncilorIds = (council.councilorIds || []).filter(id => id !== residentId);
            batch.update(councilRef, { councilorIds: newCouncilorIds });
            await updateResidentCouncilRoles(batch, residentId, councilId, council.name, null);
            if (reason !== 'Apenas remoção') {
                const residentRef = doc(db, "residents", residentId);
                const resDoc = await getDoc(residentRef);

                if (resident) {
                     const historyEntry = { id: crypto.randomUUID(), type: 'politics', status: reason, location: `Conselho: ${council.name}`, date: new Date() };
                     batch.update(residentRef, { history: [...(resident.history || []), historyEntry] });
                }

        async function handleAddStudent(businessId, residentId, course, status) {
            const residentRef = doc(db, "residents", residentId);
            const resDoc = await getDoc(residentRef);
            const newEducation = { businessId, course, status };
            if (!resDoc.exists()) throw new Error('Morador não encontrado.');
            const updated = [...(resDoc.data().education || [])];
            if (updated.some(edu => edu.businessId === businessId && edu.course === course)) throw new Error('Matrícula já cadastrada neste curso.');
            updated.push(newEducation); await updateDoc(residentRef, { education: updated });
        }

        async function simRemoveStudent(businessId, residentId, index, reason) {
            if (!studentRemovalReasons.includes(reason)) throw new Error('Motivo de desligamento inválido.');
            const reference = doc(db, 'residents', residentId);
            await runTransaction(db, async tx => {
                const snap=await tx.get(reference);
                if(!snap.exists()) throw new Error('Morador não encontrado.');
                const data=snap.data(); const education=[...(data.education||[])];
                if (!Number.isInteger(index) || !education[index] || education[index].businessId!==businessId) throw new Error('Matrícula alterada. Atualize a página.');
                if(reason==='Apenas remoção') education.splice(index,1);
                else education[index]={...education[index], status:education[index].status==='Formado(a)'?'Formado(a)':reason, exitReason:reason, exitedAt:new Date().toISOString()};
                tx.update(reference,{education});
            });
        }

        async function handleAddBusiness(data) {
            const ownerId = data.ownerId === 'null' ? null : data.ownerId;
            const regionId = data.regionId === 'null' ? null : data.regionId;
            const initial=simMoney(simParseMoney(data.balance));
            if(!Number.isFinite(initial)) throw new Error('Saldo inicial inválido.');
            const bizData = { 
                name: data.name, sector: data.sector, ownerId, regionId, 
                balance: initial,
                isPublicBody: !!data.isPublicBody,
                fixedExpenses: [],
                plans: [],
                createdAt: serverTimestamp(), 
                ...(data.sector === 'Educação' && { institutionType: data.institutionType, courses: [] }) 
            };
            const newBizRef=doc(collection(db,'businesses'));
            if(state.financeConfig.financialEra){
                const cfgRef=doc(db,'config','finance'),txRef=doc(collection(db,'financialTransactions'));
                await runTransaction(db,async tx=>{
                    const cfg=await tx.get(cfgRef);if(!cfg.exists()||!cfg.data().financialEra)throw new Error('Era financeira mudou.');
                    tx.set(newBizRef,bizData);
                    if(initial!==0){
                        tx.set(txRef,{from:initial>=0?'external':simFinAccount('businesses',newBizRef.id),to:initial>=0?simFinAccount('businesses',newBizRef.id):'external',amount:Math.abs(initial),label:'Saldo inicial de nova empresa',kind:'opening-balance',era:cfg.data().financialEra,cycle:Number(cfg.data().cycleNumber||0),date:serverTimestamp()});
                        tx.update(cfgRef,{totalCirculating:simMoney(Number(cfg.data().totalCirculating||0)+initial)});
                    }
                });
            } else await setDoc(newBizRef,bizData);
            if (ownerId) await handleHire(newBizRef.id, null, ownerId, 'Proprietário(a)', 0);
            return newBizRef.id;
        }

        async function handleEditBusiness(id, data) {
            const oldBiz = state.businesses.find(b => b.id === id);
            const newOwnerId = data.ownerId === 'null' ? null : data.ownerId;
            const newRegionId = data.regionId === 'null' ? null : data.regionId;
            const batch = writeBatch(db);
            batch.update(doc(db, "businesses", id), { 
                name: data.name, sector: data.sector, ownerId: newOwnerId, regionId: newRegionId,
                ...(state.financeConfig.financialEra ? {} : {balance: parseFloat(data.balance || 0)}),
                isPublicBody: !!data.isPublicBody,
                ...(data.sector === 'Educação' && { institutionType: data.institutionType }) 
            });
            if (oldBiz.ownerId !== newOwnerId) {
                if (oldBiz.ownerId) {
                    const oldOwner = state.residents.find(r => r.id === oldBiz.ownerId);
                    if (oldOwner) {
                        const newEmp = normalizeEmployment(oldOwner.employment).filter(j => !(j.businessId === id && j.position === 'Proprietário(a)'));
                        batch.update(doc(db, "residents", oldBiz.ownerId), { employment: newEmp });
                    }
                }
                if (newOwnerId) {
                    const newOwner = state.residents.find(r => r.id === newOwnerId);
                    if (newOwner) {
                        const newEmp = [...normalizeEmployment(newOwner.employment), { businessId: id, position: 'Proprietário(a)', salary: 0 }];
                        batch.update(doc(db, "residents", newOwnerId), { employment: newEmp });
                    }
                }
            }
            await batch.commit();
        }

        async function handleDeleteBusiness(id) {
            const batch = writeBatch(db); batch.delete(doc(db, "businesses", id));
            state.residents.forEach(r => {
                if (r.employment?.some(j => j.businessId === id)) batch.update(doc(db, "residents", r.id), { employment: r.employment.filter(j => j.businessId !== id) });
                if (r.education?.some(e => e.businessId === id)) batch.update(doc(db, "residents", r.id), { education: r.education.filter(e => e.businessId !== id) });
            });
            await batch.commit();
        }

        function generateReport(type) {
            let out = `### REGISTRO DETALHADO SIM - ${new Date().toLocaleString('pt-BR')}\n==========================\n\n`;
            if (type === 'residents') {
                const residentName = id => { const sim = state.residents.find(x => x.id === id); return sim ? `${sim.firstName} ${sim.lastName}` : 'Registro não encontrado'; };
                state.residents.filter(r => !r.isDeceased).forEach(r => {
                    const hasWallet = !['Bebê', 'Criança', 'Pré-adolescente'].includes(r.lifeStage);
                    out += `NOME: ${r.firstName} ${r.lastName}\nFASE: ${r.lifeStage || 'Não informada'}\nGÊNERO: ${r.gender || 'Não informado'}\nETNIA: ${r.ethnicity || 'Não informada'}\n`;
                    if (hasWallet) out += `SALDO: 🪙 ${Number(r.balance || 0).toLocaleString('pt-BR')} [${getSocialClass(Number(r.balance) || 0).label}]\n`;
                    out += `REGIÃO: ${state.regions.find(reg => reg.id === r.regionId)?.name || 'Não informada'}\n\nRELAÇÕES FAMILIARES E AFETIVAS:\n`;
                    out += r.relationships?.length ? r.relationships.map(rel => `- ${rel.type}: ${residentName(rel.residentId)}`).join('\n') + '\n' : '- Nenhuma relação cadastrada.\n';
                    out += `\nTRABALHO ATUAL:\n`;
                    out += r.employment?.length ? r.employment.map(job => { const biz = state.businesses.find(b => b.id === job.businessId); const branch = state.branches.find(b => b.id === job.branchId); return `- ${job.position || 'Cargo não informado'} em ${biz?.name || 'Empresa não encontrada'}${branch ? ` / ${branch.name}` : ''} (Salário por ciclo: 🪙 ${Number(job.salary || 0).toLocaleString('pt-BR')})`; }).join('\n') + '\n' : '- Nenhum emprego atual cadastrado.\n';
                    out += `\nHISTÓRICO PROFISSIONAL:\n`;
                    const pastJobs = (r.history || []).filter(entry => entry.type === 'job');
                    out += pastJobs.length ? pastJobs.map(entry => `- ${entry.status || 'Registro'}: ${entry.location || 'Local não informado'}${entry.position ? ` (${entry.position})` : ''}`).join('\n') + '\n' : '- Nenhum emprego anterior registrado.\n';
                    out += `\nFORMAÇÃO E ESTUDOS:\n`;
                    out += r.education?.length ? r.education.map(edu => `- ${edu.course}: ${edu.status} — ${state.businesses.find(b => b.id === edu.businessId)?.name || 'Instituição não encontrada'}`).join('\n') + '\n' : '- Nenhuma formação cadastrada.\n';
                    out += `--------------------------\n\n`;
                });
            } else if (type === 'businesses') {
                state.businesses.forEach(b => {
                    const owner = state.residents.find(r => r.id === b.ownerId);
                    out += `EMPRESA: ${b.name}\nRESPONSÁVEL: ${owner ? `${owner.firstName} ${owner.lastName}` : 'Em aberto / não cadastrado'}\nSALDO: 🪙 ${Number(b.balance || 0).toLocaleString('pt-BR')}\nSETOR: ${b.sector}\nTIPO: ${b.isPublicBody ? 'Órgão Público' : 'Privada'}\nREGIÃO: ${state.regions.find(r => r.id === b.regionId)?.name || 'Não informada'}\n--------------------------\n\n`;
                });
            } else if (type === 'politics') {
                out += `CENÁRIO POLÍTICO COMPLETO\n\n--- PODER EXECUTIVO ---\n`;
                const ministries = [...defaultMinistries, ...(state.government.ministries || [])];
                ministries.forEach(m => {
                    const holderId = state.government.roles?.[m.id];
                    const holder = state.residents.find(r => r.id === holderId);
                    const sal = state.government.salaries?.[m.id] || 0;
                    out += `${m.name}: ${holder ? `${holder.firstName} ${holder.lastName}` : 'CARGO VAGO'} (Salário do Tesouro: 🪙 ${sal.toLocaleString()})\n`;
                });
            } else if (type === 'obituary') {
                const dead = state.residents.filter(r => r.isDeceased).sort((a, b) => (a.deathDate?.seconds ?? Infinity) - (b.deathDate?.seconds ?? Infinity));
                dead.forEach(r => out += `+ ${r.firstName} ${r.lastName} [† ${r.deathDate?.seconds ? new Date(r.deathDate.seconds * 1000).toLocaleDateString('pt-BR') : 'Data não informada'}]\n`);
            } else if (type === 'history') {
                out = `REGISTRO HISTÓRICO DA CIDADE\nGerado em: ${new Date().toLocaleString('pt-BR')}\n==========================\n\n`;
                const events=simHistoryFiltered();
                if(!events.length) out += 'Nenhum acontecimento histórico carregado para os filtros atuais.\n';
                events.forEach(e=>{
                    out += `${simPeriodLabel(e).toUpperCase()}\n${e.title}\n${e.description||''}${e.amount!==undefined?`\nValor: 🪙 ${Number(e.amount||0).toLocaleString('pt-BR')}`:''}\nCategoria: ${e.category||'geral'}\n--------------------------\n`;
                });
                if(state.historyHasMore) out += `\nOBS.: Existem acontecimentos anteriores ainda não carregados na tela de História. Use “Carregar acontecimentos anteriores” antes de gerar o registro se quiser incluí-los.\n`;
            } else if (type === 'finance-transparency') {
                out += `RELATÓRIO FINANCEIRO MASTER (DIÁRIO OFICIAL)\n\n--- COFRE PÚBLICO (TESOURO) ---\nSaldo Atual: 🪙 ${state.financeConfig.treasuryBalance?.toLocaleString() || 0}\nEra ativa: ${state.financeConfig.financialEra || 'Nenhuma'}\nCiclo econômico atual: ${state.financeConfig.cycleNumber || 0}\n\n`;
                const budgetCycle=simBudgetCycle();
                out += `--- ORÇAMENTO PÚBLICO · CICLO ${budgetCycle} ---\n`;
                simAllMinistries().forEach(m=>{const b=simBudgetFor(m.id,budgetCycle,state.financeConfig.financialEra);out += `${m.name}: Orçado 🪙 ${Number(b.allocated||0).toLocaleString('pt-BR')} | Executado 🪙 ${Number(b.executed||0).toLocaleString('pt-BR')} | Disponível 🪙 ${simBudgetAvailable(b).toLocaleString('pt-BR')}\n`;});
                out += `\n--- ÚLTIMAS OPERAÇÕES ORÇAMENTÁRIAS ---\n`;
                (state.publicBudgetTransactions||[]).filter(x=>x.era===state.financeConfig.financialEra).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,30).forEach(x=>{out += `- ${x.typeLabel||x.type}: 🪙 ${Number(x.amount||0).toLocaleString('pt-BR')} · ${x.reason||x.destination||''} · ciclo ${x.cycle||'-'}\n`;});
                out += `\n--- TRIBUTAÇÃO VIGENTE ---\n`;
                out += `Impostos sobre Moradores:\n`;
                state.taxes.filter(t => t.category === 'resident').forEach(t => out += `- ${t.name}: ${t.rate}%\n`);
                out += `\nImpostos sobre Empresas:\n`;
                state.taxes.filter(t => t.category === 'business').forEach(t => out += `- ${t.name}: ${t.rate}%\n`);
                out += `\nImpostos Especiais (Seletivos):\n`;
                state.specialTaxes.forEach(st => out += `- ${st.name}: ${st.rate}% (Alvos: ${st.targetIds?.length || 0})\n`);
                
                out += `\n--- RANKING DE RIQUEZA (MORADORES) ---\n`;
                const topResidents = [...state.residents].filter(r => !r.isDeceased).sort((a,b) => (b.balance || 0) - (a.balance || 0)).slice(0, 10);
                topResidents.forEach((r, i) => out += `${i+1}. ${r.firstName} ${r.lastName}: 🪙 ${r.balance?.toLocaleString()}\n`);
                
                out += `\n--- RANKING DE RIQUEZA (EMPRESAS) ---\n`;
                const topBiz = [...state.businesses].sort((a,b) => (b.balance || 0) - (a.balance || 0)).slice(0, 10);
                topBiz.forEach((b, i) => out += `${i+1}. ${b.name}: 🪙 ${b.balance?.toLocaleString()}\n`);
                
                out += `\nESTATÍSTICAS GERAIS:\nTotal em Circulação: 🪙 ${state.financeConfig.totalCirculating.toLocaleString()}\n`;
            }
            document.getElementById('report-textarea').value = out; document.getElementById('report-output').classList.remove('hidden');
        }
